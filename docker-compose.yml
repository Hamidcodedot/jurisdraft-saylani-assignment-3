version: '3.8'

services:
  prelegal-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prelegal_saas
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-prelegal-production-secret-key-smit-2026}
    volumes:
      - prelegal_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prelegal_data:
    driver: local
